<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>FBS Serve</title>
<link rel="icon" href="assets/fbs-serve-logo.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar, left module rail on desktop (scroll strip on phone), content column max 1200px. Colors from the FBS Serve color system v1.0; type is Instrument Sans; spacing and radius from the Savora design guide. */
:root{
  --surface-page:#F4F6F8;--surface-card:#FFFFFF;--surface-elevated:#FFFFFF;--surface-sunken:#EEF1F5;
  --ink:#16191F;--ink-muted:#525B69;--border-control:#6B7584;--hairline:#DCE1E7;
  --brand:#476818;--brand-hover:#385217;--brand-active:#233510;--on-brand:#FFFFFF;--brand-tint:#EAF6CC;
  --brand-fill:#476818;--brand-fill-hover:#385217;--brand-fill-active:#233510;--on-brand-fill:#FFFFFF;--chip-on:#16191F;--on-chip-on:#FFFFFF;--tip-bg:#16191F;
  --secondary:#107236;--secondary-hover:#0C5A2A;--secondary-active:#08431F;--on-secondary:#FFFFFF;
  --accent:#C42A93;--accent-ink:#A51E7A;--accent-tint:#FADCEF;--on-accent:#FFFFFF;
  --disabled-bg:#EBEEF2;--disabled-ink:#5E6876;--focus:#C42A93;
  --success:#107236;--success-tint:#DCF5E5;--warning:#A7530A;--warning-tint:#FEF0D7;--error:#C11E38;--error-tint:#FDE2E6;
  --info:#1D5BD8;--info-tint:#DBE8FF;--purple:#6D33D9;--purple-tint:#ECE4FF;
  --reserved:#0B7285;--reserved-tint:#D6F2F6;--on-reserved:#FFFFFF;
  --shadow-card:0 1px 2px #3f1f140f;
  --shadow-lift:0 2px 4px rgba(22,25,31,.10),0 10px 24px rgba(22,25,31,.12);
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-pill:999px;--tap:48px;
  --main-px:24px; /* side padding of the main column; 16px on phones */
  /* Sidebar: fixed green brand treatment, same in light and dark mode. */
  --nav-bg:#2E6B3E;--nav-ink:#FFFFFF;--nav-ink-muted:#D7ECDB;--nav-hover:rgba(255,255,255,.14);
  --nav-active-bg:#E9F7E2;--nav-active-ink:#163C22;--nav-border:rgba(255,255,255,.12);
  /* Canvas (top bar and main area): near-white green in light mode, dark green in dark mode. Text on it: 16.9:1 and 7.2:1. */
  --chrome-bg:#F3F8F0;--chrome-border:#D5E2D0;--canvas-ink:#16191F;--canvas-ink-muted:#4A5A4F;--canvas-hover:rgba(22,25,31,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-page:#0F1115;--surface-card:#16291D;--surface-elevated:#1C3325;--surface-sunken:#102016;
  --ink:#EDF0F4;--ink-muted:#A9B2BF;--border-control:#808A98;--hairline:#28442F;
  --brand:#B8DF63;--brand-hover:#D4EC9C;--brand-active:#EAF6CC;--on-brand:#16191F;--brand-tint:#24301A;
  --secondary:#357A47;--secondary-hover:#2E6B3E;--secondary-active:#24563A;--on-secondary:#FFFFFF;
  --accent:#E35BBF;--accent-ink:#E35BBF;--accent-tint:#3A1530;--on-accent:#16191F;
  --disabled-bg:#272C35;--disabled-ink:#A9B2BF;--focus:#E35BBF;
  --success:#5EE08F;--success-tint:#12301F;--warning:#FDBA4D;--warning-tint:#3A2810;--error:#FF8F8F;--error-tint:#3D161D;
  --info:#7DB0FF;--info-tint:#172A4A;--purple:#BCA4FF;--purple-tint:#2A1F4A;
  --reserved:#5BD3E8;--reserved-tint:#0E3B45;--on-reserved:#06222A;
  --shadow-card:0 1px 2px #3f1f140f;
  --shadow-lift:0 2px 4px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5);
  --chrome-bg:#0C1A12;--chrome-border:rgba(255,255,255,.12);--canvas-ink:#FFFFFF;--canvas-ink-muted:#D7ECDB;--canvas-hover:rgba(255,255,255,.14);
  --brand-fill:#357A47;--brand-fill-hover:#2E6B3E;--brand-fill-active:#24563A;--on-brand-fill:#FFFFFF;--chip-on:#357A47;--on-chip-on:#FFFFFF;--tip-bg:#163C22;--nav-active-bg:#163C22;--nav-active-ink:#FFFFFF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-page:#0F1115;--surface-card:#16291D;--surface-elevated:#1C3325;--surface-sunken:#102016;
  --ink:#EDF0F4;--ink-muted:#A9B2BF;--border-control:#808A98;--hairline:#28442F;
  --brand:#B8DF63;--brand-hover:#D4EC9C;--brand-active:#EAF6CC;--on-brand:#16191F;--brand-tint:#24301A;
  --secondary:#357A47;--secondary-hover:#2E6B3E;--secondary-active:#24563A;--on-secondary:#FFFFFF;
  --accent:#E35BBF;--accent-ink:#E35BBF;--accent-tint:#3A1530;--on-accent:#16191F;
  --disabled-bg:#272C35;--disabled-ink:#A9B2BF;--focus:#E35BBF;
  --success:#5EE08F;--success-tint:#12301F;--warning:#FDBA4D;--warning-tint:#3A2810;--error:#FF8F8F;--error-tint:#3D161D;
  --info:#7DB0FF;--info-tint:#172A4A;--purple:#BCA4FF;--purple-tint:#2A1F4A;
  --reserved:#5BD3E8;--reserved-tint:#0E3B45;--on-reserved:#06222A;
  --shadow-card:0 1px 2px #3f1f140f;
  --shadow-lift:0 2px 4px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5);
  --chrome-bg:#0C1A12;--chrome-border:rgba(255,255,255,.12);--canvas-ink:#FFFFFF;--canvas-ink-muted:#D7ECDB;--canvas-hover:rgba(255,255,255,.14);
  --brand-fill:#357A47;--brand-fill-hover:#2E6B3E;--brand-fill-active:#24563A;--on-brand-fill:#FFFFFF;--chip-on:#357A47;--on-chip-on:#FFFFFF;--tip-bg:#163C22;--nav-active-bg:#163C22;--nav-active-ink:#FFFFFF;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome-bg);color:var(--ink);font:400 13px/20px var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome-bg)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4,b,strong,th{font-weight:500}
h1{font-size:23px;line-height:30px;text-wrap:balance}
h2{font-size:23px;line-height:36px;text-wrap:balance}
h3{font-size:22px;line-height:30px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.caption{font-size:14px;line-height:20px}
.label{font-size:14px;line-height:20px;font-weight:500}
.ic{flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Top bar: on staff screens it is the top of the main column (the brand lives in the sidebar); on the guest preview it is full width with the brand. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome-bg);border-bottom:1px solid var(--chrome-border)}
.main > .top{margin:-24px calc(-1 * max(var(--main-px),env(safe-area-inset-right,0px))) 24px calc(-1 * max(var(--main-px),env(safe-area-inset-left,0px)))}
.main > .top .top-in{padding-left:max(var(--main-px),env(safe-area-inset-left,0px));padding-right:max(var(--main-px),env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;min-height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:22px;color:var(--canvas-ink)}
.logo{width:36px;height:36px;border-radius:9px;display:block;flex:none}
.brand small{font-size:14px;color:var(--canvas-ink-muted);font-weight:400}
.spacer{flex:1}
.top .icon-btn{color:var(--canvas-ink)}
.top .icon-btn:hover{background:var(--canvas-hover)}
.seg{display:inline-flex;background:var(--canvas-hover);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{min-height:40px;border:0;background:none;border-radius:var(--r-pill);padding:0 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--canvas-ink-muted)}
.seg button:hover{color:var(--canvas-ink)}
.seg button[aria-pressed="true"]{background:var(--nav-bg);color:var(--nav-ink);box-shadow:none}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100dvh - env(safe-area-inset-top,0px))}
/* Rail is always as tall as the screen, even when the page is short, and stays put while the page scrolls. Green brand sidebar with the logo at the top, same in light and dark mode. */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--nav-border);background:var(--nav-bg);padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
/* 65px tall with its border, the same as the top bar, so the line under the logo meets the top bar's bottom border. */
.rail-brand{display:flex;align-items:center;gap:10px;flex:none;min-height:65px;padding:0 18px;margin:0 -8px 12px;border-bottom:1px solid var(--nav-border);color:var(--nav-ink);font-size:19px;line-height:24px;font-weight:500}
.rail-brand small{display:block;font-size:13px;line-height:18px;font-weight:400;color:var(--nav-ink-muted)}
.nav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:var(--r-md);border:0;background:none;cursor:pointer;font-weight:500;color:var(--nav-ink-muted);text-align:left;width:100%;transition:background .15s}
.nav:hover{background:var(--nav-hover);color:var(--nav-ink)}
.nav[aria-current="page"]{background:var(--nav-active-bg);color:var(--nav-active-ink)}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;font-size:12px;line-height:20px}
.badge{min-width:24px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--brand-fill);color:var(--on-brand-fill);font-size:14px;line-height:24px;font-weight:500;text-align:center}
.badge.soft{background:var(--surface-sunken);color:var(--ink)}
.main{min-width:0;display:flex;flex-direction:column;padding-block:24px 0;padding-left:max(var(--main-px),env(safe-area-inset-left,0px));padding-right:max(var(--main-px),env(safe-area-inset-right,0px))}
/* The wrap sits flat on the canvas with no panel edge. Cards, columns and rows inside it keep their own surface color; loose text straight on the canvas (page titles, toolbar headings, the notes below) uses the canvas ink colors. */
.wrap{width:100%;display:flex;flex-direction:column;gap:24px;flex:1}
.page-head h1{color:var(--canvas-ink)}
.page-head p{color:var(--canvas-ink-muted)}
.toolbar h2{color:var(--canvas-ink)}
.canvas-note{color:var(--canvas-ink-muted)}
/* Footer: full width, small and faded so it stays out of the way. */
.main > .foot{width:100%;margin-top:16px;padding:12px 0 16px;border-top:1px solid var(--chrome-border);display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--canvas-ink-muted)}
.main > .foot span{opacity:.5}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head > div{flex:1;min-width:240px}
.page-head p{margin-top:4px}
@media (max-width:860px){
  :root{--main-px:16px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{height:auto;align-self:stretch;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--nav-border);padding:8px max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
  .rail-brand{flex:none;min-height:0;padding:0 12px 0 0;margin:0 4px 0 0;border-bottom:0;border-right:1px solid var(--nav-border)}
  .rail-brand small{display:none}
  .main > .top{position:static}
  .nav{width:auto;flex:none}
  h1{font-size:23px;line-height:30px}
}

/* Alert banner */
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);flex-wrap:wrap}
.alert p{flex:1;min-width:200px}
.alert.brand{background:var(--accent-tint);color:var(--ink);gap:8px;padding:8px 12px;font-size:12px;line-height:18px}
.alert.brand .btn{min-height:32px;padding:0 12px;font-size:12px;line-height:18px}
.alert.brand .ic{color:var(--accent);width:18px;height:18px}
.alert.info{background:var(--info-tint)}
.alert.warn{background:var(--warning-tint)}
.alert.warn .ic{color:var(--warning)}
.alert.ok{background:var(--success-tint)}
.alert.ok .ic{color:var(--success)}
.alert.err{background:var(--error-tint)}
.alert.err .ic{color:var(--error)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-md);border:1.5px solid transparent;font-weight:500;font-size:12px;line-height:18px;cursor:pointer;transition:background .15s,transform .08s;text-decoration:none;white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--brand-fill);color:var(--on-brand-fill)}
.btn-primary:hover{background:var(--brand-fill-hover)}
.btn-primary:active{background:var(--brand-fill-active)}
.btn-secondary{background:var(--secondary);color:var(--on-secondary)}
.btn-secondary:hover{background:var(--secondary-hover)}
.btn-secondary:active{background:var(--secondary-active)}
.btn-outline{background:var(--surface-card);border-color:var(--border-control);color:var(--ink)}
.btn-outline:hover{background:var(--brand-tint)}
.btn-ghost{background:none;color:var(--ink)}
.btn-ghost:hover{background:var(--brand-tint)}
.btn-danger{background:var(--error);color:var(--on-brand)}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-ink);border-color:transparent;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;border-radius:var(--r-md);border:0;background:none;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--brand-tint)}
.icon-btn.danger{color:var(--error)}
@media (prefers-reduced-motion:reduce){.btn:active:not(:disabled){transform:none}*{animation:none!important;transition:none!important}}

/* Cards, pills, chips */
.card{background:var(--surface-card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:24px;min-width:0}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head h3{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 8px;border-radius:var(--r-pill);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.data .pill{font-size:12px;line-height:16px;padding:2px 8px 2px 6px}
.data .pill .ic{width:14px;height:14px}
.p-neutral{background:var(--disabled-bg);color:var(--disabled-ink)}
.p-info{background:var(--info-tint);color:var(--info)}
.p-warn{background:var(--warning-tint);color:var(--warning)}
.p-ok{background:var(--success-tint);color:var(--success)}
.p-brand{background:var(--brand-tint);color:var(--brand)}
.p-accent{background:var(--accent-tint);color:var(--accent-ink)}
.p-purple{background:var(--purple-tint);color:var(--purple)}
.p-error{background:var(--error-tint);color:var(--error)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--border-control);background:var(--surface-card);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--brand-tint)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--on-chip-on)}
.tag{display:inline-block;padding:0 8px;border-radius:var(--r-sm);font-size:14px;line-height:22px;font-weight:500}
.tag-new{background:var(--info-tint);color:var(--info)}
.tag-must{background:var(--brand-tint);color:var(--brand)}
.tag-best{background:var(--accent-tint);color:var(--accent-ink)}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .val{font-size:32px;line-height:40px;font-weight:500}
.tile .ic{color:var(--brand)}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.bar-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar-row .rank{font-weight:500;color:var(--ink-muted)}
.bar-track{grid-column:2/4;height:10px;border-radius:var(--r-pill);background:var(--surface-sunken);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--brand-fill)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hairline)}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-sunken);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:24px;line-height:30px}
@media (max-width:480px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Data table */
/* Tables: 10px corners and a header in the sidebar green (white text, 6.4:1), in light and dark mode. */
.tbl-scroll{overflow-x:auto;border-radius:10px;background:var(--surface-card);box-shadow:var(--shadow-card)}
table.data{width:100%;border-collapse:collapse;min-width:720px}
.data th{text-align:left;font-size:14px;line-height:20px;font-weight:500;color:var(--nav-ink);padding:12px 16px;border-bottom:1px solid var(--nav-bg);background:var(--nav-bg);white-space:nowrap}
.data td{padding:12px 16px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.data td .link{min-height:0}
/* Pagination under tables: 15 rows per page. */
.loadmore{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--canvas-ink-muted);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager-btns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pager-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pp{display:flex;align-items:center;gap:8px;color:var(--canvas-ink-muted);white-space:nowrap}
.pp select.input{width:auto;min-height:36px;padding:4px 8px;border-radius:8px;border:1px solid var(--hairline);font-weight:500;color:var(--ink)}
.pg{min-width:36px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--hairline);background:var(--surface-card);color:var(--ink);cursor:pointer;display:inline-grid;place-items:center;font-weight:500}
.pg:hover:not(:disabled){background:var(--brand-tint)}
.pg[aria-current="page"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--on-chip-on)}
.pg:disabled{opacity:.4;cursor:default}
.pg-gap{min-width:20px;text-align:center;color:var(--canvas-ink-muted)}
/* Column filters (Orders): a funnel button in each header opens a small panel; a filtered column's button is filled. */
.th-f{display:flex;align-items:center;gap:6px}
.data th.r .th-f{justify-content:flex-end}
.th-btn{width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--nav-ink-muted);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.th-btn:hover{background:var(--nav-hover);color:var(--nav-ink)}
.th-btn.on{background:var(--nav-ink);color:var(--nav-bg)}
.colpop{position:fixed;z-index:100;width:264px;max-height:calc(100vh - 16px);overflow:auto;padding:12px;border-radius:10px;background:var(--surface-elevated);border:1px solid var(--hairline);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.cf-list{display:flex;flex-direction:column;max-height:240px;overflow:auto;margin:0 -4px}
.cf-opt{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px;border-radius:6px;cursor:pointer}
.cf-opt:hover{background:var(--brand-tint)}
.cf-opt input{width:18px;height:18px;accent-color:var(--brand-fill);flex:none}
.cf-opt .grow{flex:1;min-width:0}
.cf-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf-range .input{min-width:0}
.cf-foot{display:flex;justify-content:flex-end;gap:8px}
.cf-foot .btn{min-height:36px}
/* Row actions: up to 3 icon buttons with a tooltip; 4 or more go in a ⋯ menu (see rowActions). */
.row-acts{display:inline-flex;gap:4px;justify-content:flex-end;vertical-align:middle}
.icon-btn.sm{width:32px;height:32px;border-radius:8px}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:6px;background:var(--tip-bg);color:#FFFFFF;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.tip:hover::after,.tip:focus-visible::after{opacity:1}
.rowmenu{position:fixed;z-index:100;min-width:180px;padding:6px;border-radius:10px;background:var(--surface-elevated);border:1px solid var(--hairline);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:2px}
.rowmenu button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:500;text-align:left}
.rowmenu button:hover,.rowmenu button:focus-visible{background:var(--brand-tint);outline:none}
.rowmenu button.danger{color:var(--error)}
.data tr:last-child td{border-bottom:0}
.data tbody tr.click{cursor:pointer}
.data tbody tr.click:hover{background:var(--brand-tint)}
.data .r{text-align:right}
.link{background:none;border:0;padding:0;font-weight:500;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink-muted)}
.search input{padding-left:44px}
.empty{padding:48px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span:first-child{font-size:14px;line-height:20px;font-weight:500}
.input,select.input,textarea.input{min-height:var(--tap);padding:10px 12px;border:1.5px solid var(--border-control);border-radius:var(--r-sm);background:var(--surface-card);width:100%}
textarea.input{min-height:96px;resize:vertical}
.hint{font-size:14px;line-height:20px;color:var(--ink-muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;align-items:center;gap:12px;min-height:var(--tap);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.checks{display:flex;flex-wrap:wrap;gap:0 20px}
.radio-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--border-control);border-radius:var(--r-md);cursor:pointer;min-height:56px}
.radio-card:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
.radio-card input{width:20px;height:20px;accent-color:var(--brand)}
.radio-card .grow{flex:1}

/* Dialog */
dialog{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface-elevated);color:var(--ink);box-shadow:var(--shadow-lift);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(22,19,15,.55)}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 16px 0 24px}
.m-head h2{flex:1;font-size:22px;line-height:30px}
.m-body{padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 24px;flex-wrap:wrap}
.qr{width:220px;height:220px;display:block;margin:0 auto;border-radius:var(--r-md)}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px;background:var(--surface-sunken);border-radius:var(--r-lg)}
.sum{display:flex;flex-direction:column;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .total{border-top:1px solid var(--hairline);padding-top:8px;font-weight:500;font-size:20px;line-height:28px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface-card);padding:12px 20px;border-radius:var(--r-md);font-weight:500;box-shadow:var(--shadow-lift);z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}

/* Kitchen kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-sunken);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 0}
.col-head h3{font-size:18px;line-height:28px;flex:1}
.kcard{background:var(--surface-card);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.kcard-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.kcard li{display:flex;gap:8px}
.kcard li b{min-width:28px}
.late{color:var(--error)}
.kcard.overdue{box-shadow:0 0 0 2px var(--focus),var(--shadow-card)}
.col-empty{color:var(--ink-muted);text-align:center;padding:24px 8px;font-size:14px}

/* Foods */
.food-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1279px){.food-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1023px){.food-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:639px){.food-grid{grid-template-columns:minmax(0,1fr)}}
.fcard{background:var(--surface-card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}
.fcard:hover{box-shadow:var(--shadow-lift)}
.fimg{aspect-ratio:16/10;max-width:100%;position:relative}
.fimg img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center}
.cat-0{background:var(--brand-tint);color:var(--brand)}
.cat-1{background:var(--accent-tint);color:var(--accent-ink)}
.cat-2{background:var(--info-tint);color:var(--info)}
.cat-3{background:var(--warning-tint);color:var(--warning)}
.cat-4{background:var(--purple-tint);color:var(--purple)}
.fimg .pill{position:absolute;top:12px;left:12px}
.fbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.fbody .row{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.price{font-size:20px;line-height:28px;font-weight:500}
.price .from{font-size:12px;line-height:16px;font-weight:400;color:var(--ink-muted);margin-right:4px}
/* Reservations: calendar, day agenda, and the unique Reserved color (teal-cyan, used nowhere else). */
.p-reserved{background:var(--reserved-tint);color:var(--reserved)}
.alert.rsv{background:var(--reserved-tint);color:var(--ink);gap:8px;padding:8px 12px;font-size:12px;line-height:18px}
.alert.rsv .btn{min-height:32px;padding:0 12px;font-size:12px;line-height:18px}
.alert.rsv > .ic{color:var(--reserved);width:18px;height:18px}
.alert.rsv .icon-btn{width:32px;height:32px}
/* Takeout channel tag: neutral pill with a colored dot (brand color, GrabFood green, Foodpanda pink). */
.chan{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:var(--r-pill);background:var(--surface-sunken);color:var(--ink);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.chan i{width:8px;height:8px;border-radius:50%;flex:none}
.data .chan{font-size:12px;line-height:16px;padding:2px 8px 2px 6px}
/* Split bill: payers with an amount and a payment method each. */
.split{display:flex;flex-direction:column;gap:12px}
.split-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.split-rows{display:flex;flex-direction:column;gap:8px}
.split-row{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.split-left{font-weight:500;color:var(--success)}
.split-left.bad{color:var(--error)}
.btn-outline.danger{color:var(--error);border-color:var(--error)}
.hint.bad{color:var(--error)}
.res-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.res-nav{display:flex;gap:4px}
.res-title{font-size:19px;line-height:26px;font-weight:500;color:var(--canvas-ink);background:none;border:0;padding:4px 8px;border-radius:8px;cursor:pointer}
.res-title:hover{background:var(--canvas-hover)}
.res-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.res-layout{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-card);overflow:hidden}
.cal-dows,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dows div{padding:10px 8px;font-size:13px;font-weight:500;text-align:center;background:var(--nav-bg);color:var(--nav-ink)}
.cal-cell{position:relative;min-height:116px;padding:6px;border-top:1px solid var(--hairline);border-left:1px solid var(--hairline);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cal-cell:nth-child(7n+1){border-left:0}
.cal-cell.out{background:var(--surface-sunken)}
.cal-cell.out .cal-num{color:var(--ink-muted)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.cal-cell.over{background:var(--reserved-tint)}
.cal-num{align-self:flex-start;min-width:28px;height:28px;padding:0 6px;border:0;border-radius:14px;background:none;font-weight:500;color:var(--ink);cursor:pointer}
.cal-num:hover{background:var(--brand-tint)}
.cal-cell.today .cal-num{background:var(--brand-fill);color:var(--on-brand-fill)}
.cal-add{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--ink-muted);display:grid;place-items:center;cursor:pointer;opacity:0}
.cal-cell:hover .cal-add,.cal-add:focus-visible{opacity:1}
.cal-add:hover{background:var(--brand-tint);color:var(--ink)}
.cal-chip{display:flex;align-items:center;gap:4px;width:100%;min-width:0;border:0;border-radius:6px;padding:2px 6px;font-size:12px;line-height:18px;text-align:left;cursor:pointer;background:var(--reserved-tint);color:var(--reserved)}
.cal-chip .tt{font-weight:500;white-space:nowrap}
.cal-chip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cal-chip .ic{width:12px;height:12px;flex:none}
.cal-chip.st-arrived{background:var(--success-tint);color:var(--success)}
.cal-chip.st-cancelled{background:var(--disabled-bg);color:var(--disabled-ink);text-decoration:line-through}
.cal-chip.st-noshow{background:var(--error-tint);color:var(--error)}
.cal-chip[draggable="true"]{cursor:grab}
.cal-more{border:0;background:none;padding:0 6px;font-size:12px;color:var(--ink-muted);text-align:left;cursor:pointer}
.cal-more:hover{text-decoration:underline}
@media (max-width:720px){.cal-chip .nm{display:none}.cal-cell{min-height:84px;padding:4px}}
.agenda{display:flex;flex-direction:column;gap:12px}
.agenda ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.agenda li + li{border-top:1px solid var(--hairline)}
.ag-item{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:none;padding:12px 0;text-align:left;cursor:pointer;color:inherit}
.ag-item .tt{min-width:64px;font-weight:500}
.ag-item .grow{flex:1;min-width:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.wk{grid-template-columns:minmax(0,1fr)}}
.wk-day{background:var(--surface-card);border-radius:10px;box-shadow:var(--shadow-card);min-height:200px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-day.today{box-shadow:inset 0 0 0 2px var(--brand-fill),var(--shadow-card)}
.wk-day.over{background:var(--reserved-tint)}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:4px;border:0;background:none;padding:4px;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:500}
.wk-card{display:flex;flex-direction:column;gap:2px;width:100%;border:1px solid var(--hairline);border-left:4px solid var(--reserved);border-radius:6px;background:var(--surface-card);padding:6px 8px;text-align:left;cursor:pointer;color:var(--ink);font-size:13px;line-height:18px}
.wk-card.st-arrived{border-left-color:var(--success)}
.wk-card.st-cancelled{border-left-color:var(--disabled-ink);opacity:.7}
.wk-card.st-noshow{border-left-color:var(--error)}
.wk-card .t{font-weight:500}
.wk-card[draggable="true"]{cursor:grab}
/* Reserved on the floor plan: its own color, an icon and the time. */
.tbl.t-reserved{border-color:var(--reserved);background:var(--reserved-tint)}
.tbl.t-reserved .st{color:var(--reserved)}
.tbl .rsv-time{font-size:12px;line-height:16px;font-weight:500;color:var(--reserved)}
.rsv-badge{position:absolute;top:-8px;left:-8px;height:24px;padding:0 7px;border-radius:12px;background:var(--reserved);color:var(--on-reserved);display:inline-flex;align-items:center;gap:3px;z-index:2;font-size:11px;line-height:24px;font-weight:500;box-shadow:0 0 0 2px var(--surface-card)}
.rsv-badge .ic{width:13px;height:13px}
/* Variants (sizes, portions): chips on cards, and the editor in the food modal. */
.vchips{display:flex;flex-wrap:wrap;gap:4px}
.vchip{display:inline-flex;gap:4px;align-items:baseline;padding:1px 8px;border-radius:var(--r-pill);background:var(--surface-sunken);font-size:12px;line-height:18px;color:var(--ink-muted);white-space:nowrap}
.vchip b{color:var(--ink);font-weight:500}
.ff-variants{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* Variant picker: a bottom sheet that stays inside the guest phone. */
.g-sheet-wrap{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;animation:fade-in .15s ease-out}
.g-scrim{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.55);cursor:default}
.g-sheet{position:relative;width:100%;max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px 20px 0 0;background:var(--surface-elevated);color:var(--ink);box-shadow:var(--shadow-lift);animation:sheet-up .2s ease-out}
.g-sheet-head{display:flex;align-items:flex-start;gap:8px}
.g-sheet-head .grow{flex:1;min-width:0}
@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ff-var{display:grid;grid-template-columns:minmax(0,1fr) 140px 48px;gap:8px;align-items:center;width:100%}
.factions{display:flex;gap:8px;padding:0 16px 16px;margin-top:auto}
.factions .btn{flex:1}
.thumb{width:56px;height:40px;border-radius:var(--r-sm);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.unavail{opacity:.72}

/* Settings tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);overflow-x:auto}
.tab{min-height:var(--tap);padding:0 16px;border:0;background:none;font-weight:500;color:var(--ink-muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* Guide */
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1023px){.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:639px){.guide-grid{grid-template-columns:minmax(0,1fr)}}
.gcard{display:flex;flex-direction:column;gap:12px}
.gcard .gi{width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--brand-tint);color:var(--brand)}
.gcard ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.gcard .btn{margin-top:auto;align-self:flex-start}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
.flow li{background:var(--surface-sunken);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px}
.flow .n{width:28px;height:28px;border-radius:var(--r-pill);background:var(--brand-fill);color:var(--on-brand-fill);display:grid;place-items:center;font-weight:500;font-size:14px}
@media (max-width:1000px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tables floor plan */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.floor-scroll{overflow-x:auto;border-radius:var(--r-lg);background:var(--surface-card);box-shadow:var(--shadow-card);padding:16px}
.floor{position:relative;min-width:900px;aspect-ratio:16/9.6;border-radius:var(--r-md);
  background-color:var(--surface-sunken);
  background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);
  background-size:40px 40px}
.tw{position:absolute;transform:translate(-50%,-50%);display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;align-items:center;justify-items:center;gap:4px}
.tw.open{z-index:5}
.chairs{display:flex;gap:10px}
.chair{width:22px;height:10px;border-radius:6px;background:var(--border-control);opacity:.55}
.tbl{grid-column:2;grid-row:2;border:2px solid var(--border-control);background:var(--surface-card);border-radius:var(--r-md);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px;box-shadow:var(--shadow-card);transition:box-shadow .2s}
.tbl:hover{box-shadow:var(--shadow-lift)}
.tbl.round{border-radius:50%}
.tbl b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floor.editing{outline:2px dashed var(--brand);outline-offset:4px}
.floor.editing .tbl{cursor:grab;touch-action:none}
.floor.editing .tbl:active{cursor:grabbing}
.tw.dragging{z-index:7;opacity:.85}
.floor-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){.desk-only{display:none!important}}
.tbl b{font-size:15px;line-height:20px}
.tbl .st{font-size:14px;line-height:18px;font-weight:500;display:flex;align-items:center;gap:4px}
.tbl .st .ic{width:16px;height:16px}
.tbl.t-inactive{border-style:dashed;background:var(--surface-card);color:var(--ink-muted)}
.tbl.t-active{border-color:var(--info);background:var(--info-tint)}
.tbl.t-active .st{color:var(--info)}
.tbl.t-ordering{border-color:var(--warning);background:var(--warning-tint)}
.tbl.t-ordering .st{color:var(--warning)}
.tbl.t-eating{border-color:var(--success);background:var(--success-tint)}
.tbl.t-eating .st{color:var(--success)}
.tbl.t-billout{border-color:var(--accent);background:var(--accent-tint);animation:ring 1.6s ease-out infinite}
.tbl.t-billout .st{color:var(--accent-ink)}
.tbl.overstay{border-color:var(--error)}
.tbl.overstay:not(.t-billout){animation:ringerr 1.6s ease-out infinite}
.overstay-badge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--error);color:#fff;display:grid;place-items:center;z-index:2;box-shadow:0 0 0 2px var(--surface-card)}
.overstay-badge .ic{width:14px;height:14px}
@keyframes ringerr{0%{box-shadow:0 0 0 0 var(--error)}100%{box-shadow:0 0 0 14px transparent}}
.tbl.t-cleaning{border-color:var(--purple);background:var(--purple-tint)}
.tbl.t-cleaning .st{color:var(--purple)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 14px transparent}}
.pop{position:absolute;width:320px;background:var(--surface-elevated);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:6;text-align:left;cursor:default}
.pop.dn{top:calc(100% + 8px)}
.pop.up{bottom:calc(100% + 8px)}
.pop.al{left:0}
.pop.ar{right:0}
.pop-head{display:flex;align-items:center;gap:8px}
.pop-head h3{flex:1;font-size:20px;line-height:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;line-height:20px}
.kv dt{color:var(--ink-muted)}
.kv dd{margin:0;font-weight:500}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}

// n equal shares of due, in cents; the last payer takes the leftover cent(s). Methods are kept for payers that already had one.
function equalRows(n, due, old = []){

  const rows = Array.from({length:n}, (_, i) => ({amt:base, method:old[i]?.method || def}));
  rows[n - 1].amt = r2(due - base * (n - 1)); return rows;
}

// The payments for a form: one method, or the split rows. Returns null (with a message) if a split does not add up.
function collectPayments(fd, due){
  if (!S.split.on) return [{method:fd.get('method'), amount:due}];
  const rows = S.split.rows.map(r => ({method:r.method, amount:r2(+r.amt || 0)}));
  if (rows.some(r => !(r.amount > 0)) || r2(sum(rows.map(r => r.amount)) - due) !== 0){ toast(`The payments must add up to ${peso(due)}`); return null; }
  return rows;

// Marks the orders paid. With a split, every order gets its share of each payer's payment (the last order takes the rounding).
function settleOrders(orders, pays, dObj){
  const pct = dObj?.pct || 0, totals = orders.map(o => r2(subtotal(o) * (1 - pct / 100))), grand = r2(sum(totals)) || 1, left = pays.map(x => x.amount);
  orders.forEach((o, i) => {
    let parts;
    if (pays.length === 1) parts = [{method:pays[0].method, amount:totals[i]}];
    else if (i === orders.length - 1) parts = pays.map((x, j) => ({method:x.method, amount:r2(left[j])}));
    else { let rest = totals[i]; parts = pays.map((x, j) => { const a = j === pays.length - 1 ? r2(rest) : r2(x.amount * totals[i] / grand); rest = r2(rest - a); left[j] = r2(left[j] - a); return {method:x.method, amount:a}; }); }
    Object.assign(o, {status:'paid', discount:dObj, paidAt:Date.now(), payments:parts, payment:pays.length > 1 ? 'split' : pays[0].method});
  });
}

function qrSvg(text, label = 'QR code for the table link'){

  return `<svg class="qr" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="${label}"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

}

// Seats a booked reservation: activates the table, puts the advance order on its plate, and shows the QR.
function seatReservation(r, tableId){
  const t = tableOf(tableId); if (!t || t.status !== 'inactive') return toast('That table is in use');

  Object.assign(r, {status:'arrived', tableId:t.id, arrivedAt:Date.now()});

function moveResToDay(r, day){
  if (r.status !== 'booked') return toast('Only booked reservations can be moved');
  if (sod(r.at) === day) return;
  const nd = new Date(day), od = new Date(r.at); nd.setHours(od.getHours(), od.getMinutes(), 0, 0);
  const problem = resProblem(r.tableId, r.pax, +nd, r.id); if (problem) return toast(problem);

        ${rs.map(r => `<button class="wk-card st-${r.status}" data-act="res-open" data-id="${r.id}" ${r.status === 'booked' ? `draggable="true" data-rdrag="${r.id}"` : ''}><span class="t num">${tm(r.at)}${r.order?.length ? ' · Pre-order' : ''}</span><span>${esc(r.name)}</span><span class="caption muted">${r.pax} guests · ${r.tableId ? esc(tName(r.tableId)) : 'No table'}</span></button>`).join('') || '<span class="caption muted">Free</span>'}</section>`; }).join('')}</div>`;

function tableBody(t){
  const os = sessionOrders(t), items = aggregate(os.filter(o => o.status !== 'paid' || t.status === 'cleaning'));
  const ready = os.filter(o => o.status === 'completed');
  const a = [];
  const rv = tableRes(t);
  if (rv && t.status === 'inactive') a.push(`<button class="btn btn-primary" data-act="res-seat" data-id="${rv.id}">${icon('calendar', 20)}Seat ${esc(rv.name)}</button>`);
  if (t.status === 'inactive') a.push(`<button class="btn ${rv ? 'btn-outline' : 'btn-primary'}" data-act="activate" data-id="${t.id}">${icon('qr', 20)}Activate table</button>`);
  if (['active','ordering','eating'].includes(t.status)) a.push(`<button class="btn btn-outline" data-act="show-qr" data-id="${t.id}">${icon('qr', 20)}Show QR</button>`);
  ready.forEach(o => a.push(`<button class="btn btn-secondary" data-act="serve" data-id="${o.id}">${icon('check', 20)}Serve ${o.id}</button>`));
  if (t.status === 'billout') a.push(`<button class="btn btn-primary" data-act="receive" data-id="${t.id}">${icon('wallet', 20)}Receive payment</button>`);
  if (t.status === 'cleaning') a.push(`<button class="btn btn-primary" data-act="clean" data-id="${t.id}">${icon('sparkle', 20)}Mark as clean</button>`);
  if (t.token && t.status !== 'cleaning') a.push(`<button class="btn btn-ghost" data-act="open-guest" data-id="${t.id}">${icon('phone', 20)}Guest view</button>`);
  const over = tableOverLimit(t);
  return `${over ? `<div class="alert err"><span class="ic">${icon('clock', 18)}</span><p><b>Over the stay time limit</b><br><span class="caption">Seated for ${mins(t.openedAt)} min, past the ${S.tableTimerMins} min limit.</span></p></div>` : ''}
  <dl class="kv"><dt>Status</dt><dd>${tPill(t)}</dd><dt>Seats</dt><dd>${t.seats}</dd>${rv ? `<dt>Reserved</dt><dd class="num">${tm(rv.at)} · ${esc(rv.name)} · ${rv.pax} guests${rv.order?.length ? ' · advance order' : ''}</dd>` : ''}${t.guests ? `<dt>Guests</dt><dd class="num">${t.guests}</dd>` : ''}
    ${t.openedAt ? `<dt>Seated</dt><dd class="num">${tm(t.openedAt)} (${mins(t.openedAt)} min)</dd>` : ''}
    ${os.length ? `<dt>Orders</dt><dd class="num">${os.map(o => `${o.id} at ${tm(o.createdAt)} · ${OSTAT[o.status].l}`).join('<br>')}</dd>` : ''}
    ${t.bill ? `<dt>Pays with</dt><dd>${esc(payName(t.bill.method))}</dd>` : ''}</dl>
  ${items.length ? `<ul class="items">${items.map(i => `<li><b class="num">${i.qty}×</b><span>${esc(i.name)}</span><span class="num">${peso(i.qty * i.price)}</span></li>`).join('')}</ul><div class="sum"><div class="total"><span>Total</span><span class="num">${peso(sum(os.map(total)))}</span></div></div>`
    : `<p class="caption muted">${t.status === 'inactive' ? 'No guests. When guests sit here, tap Activate table to show their QR code.' : 'No orders yet.'}</p>`}
  ${a.length ? `<div class="pop-actions">${a.join('')}</div>` : ''}`;
}

function tableShape(n){
  // [top chairs, bottom chairs, width, height, round]. One chair per seat, split above and below the table,
  // so the chairs show the seat count (Table 4: two above, two below). The table is at least as wide as its chair row.
  const top = Math.ceil(n / 2), bot = Math.floor(n / 2);
  if (n <= 2) return [top, bot, 96, 96, true];
  return [top, bot, Math.max(n <= 4 ? 120 : 136, top * 32 + 22), 92, false];
}

function cell(f, v){
  if (f.t === 'check') return v ? '<span class="pill p-ok">Yes</span>' : '<span class="pill p-neutral">No</span>';
  if (f.t === 'select') return esc(f.opts().find(o => o[0] === v)?.[1] || '—');
  if (f.t === 'multi') return esc((v || []).map(id => f.opts().find(o => o[0] === id)?.[1]).filter(Boolean).join(', ')) || '<span class="muted">None</span>';
  if (f.k === 'pct') return `<span class="num">${v}%</span>`;
  return esc(v) || '<span class="muted">—</span>';
}

const lb = $('#lb');
let LB = null;
function lbRender(){
  const {f, i} = LB, n = f.photos.length;
  lb.innerHTML = `<div class="lb-top"><div class="grow"><b>${esc(f.name)}</b><div class="caption num">Photo ${i + 1} of ${n} · ${hasV(f) ? 'from ' : ''}${peso(f.price)} · about ${f.eta} min</div></div>

  <div class="lb-stage" id="lb-stage"><img id="lb-img" src="${f.photos[i]}" alt="${esc(f.name)}, photo ${i + 1} of ${n}">
    ${n > 1 ? `<button class="icon-btn lb-nav prev" data-act="lb-step" data-v="-1" aria-label="Previous photo" ${i ? '' : 'disabled'}>${icon('arrow')}</button><button class="icon-btn lb-nav next" data-act="lb-step" data-v="1" aria-label="Next photo" ${i < n - 1 ? '' : 'disabled'}>${icon('arrow')}</button>` : ''}</div>
  <div class="lb-bottom"><div class="lb-thumbs">${n > 1 ? f.photos.map((src, k) => `<button data-act="lb-go" data-v="${k}" aria-label="Photo ${k + 1}" aria-current="${k === i}"><img src="${src}" alt=""></button>`).join('') : ''}</div>
    <div class="lb-zoom"><button class="icon-btn" data-act="lb-zoom" data-v="-0.5" aria-label="Zoom out">${icon('minus')}</button><span id="lb-pct" class="num" aria-live="polite"></span><button class="icon-btn" data-act="lb-zoom" data-v="0.5" aria-label="Zoom in">${icon('plus')}</button></div></div>`;
  lbApply();
}
function lbApply(){
  const st = $('#lb-stage'), img = $('#lb-img'); if (!st) return;
  const mx = (LB.s - 1) * st.clientWidth / 2, my = (LB.s - 1) * st.clientHeight / 2;
  LB.x = clamp(LB.x, -mx, mx); LB.y = clamp(LB.y, -my, my);
  img.style.transform = `translate(${LB.x}px, ${LB.y}px) scale(${LB.s})`;
  st.classList.toggle('zoomed', LB.s > 1);
  $('#lb-pct').textContent = Math.round(LB.s * 100) + '%';
}
const lbZoom = z => { LB.s = clamp(z, 1, 4); if (LB.s === 1){ LB.x = 0; LB.y = 0; } lbApply(); };
const lbGo = i => { if (i < 0 || i >= LB.f.photos.length) return; Object.assign(LB, {i, s:1, x:0, y:0}); lbRender(); };
const ptrs = new Map(); let pinch = null, pan = null;
lb.addEventListener('pointerdown', e => {
  const st = e.target.closest('#lb-stage'); if (!st || e.target.closest('button')) return;
  st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s:LB.s}; pan = null; }
  else if (LB.s > 1){ pan = {x:e.clientX - LB.x, y:e.clientY - LB.y}; st.classList.add('panning'); }
});
lb.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
  if (pinch && ptrs.size === 2){ const [a, b] = [...ptrs.values()]; lbZoom(pinch.s * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d); }
  else if (pan){ LB.x = e.clientX - pan.x; LB.y = e.clientY - pan.y; lbApply(); }
});
const lbUp = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size){ pan = null; $('#lb-stage')?.classList.remove('panning'); } };
lb.addEventListener('pointerup', lbUp); lb.addEventListener('pointercancel', lbUp);
lb.addEventListener('dblclick', e => { if (e.target.closest('#lb-stage') && !e.target.closest('button')) lbZoom(LB.s > 1 ? 1 : 2.5); });
lb.addEventListener('wheel', e => { if (!e.target.closest('#lb-stage')) return; e.preventDefault(); lbZoom(LB.s - Math.sign(e.deltaY) * .25); }, {passive:false});
lb.addEventListener('keydown', e => {
  const k = {ArrowLeft:() => lbGo(LB.i - 1), ArrowRight:() => lbGo(LB.i + 1), '+':() => lbZoom(LB.s + .5), '=':() => lbZoom(LB.s + .5), '-':() => lbZoom(LB.s - .5)}[e.key];
  if (k){ e.preventDefault(); k(); }
});
lb.addEventListener('close', () => { lb.innerHTML = ''; LB = null; ptrs.clear(); pinch = pan = null; });

const FORMS = {
  activate:(fd, f) => {
    const t = tableOf(f.dataset.id);
    Object.assign(t, {status:'active', token:uid(), openedAt:Date.now(), bill:null, guests:+fd.get('guests')}); S.plates[t.id] = [];
    qrModal(t); toast(`${t.name} is active. Show the QR code to the guests.`);
  },
  pay:(fd, f) => {
    const t = tableOf(f.dataset.id), disc = S.discounts.find(d => d.id === fd.get('disc')), dObj = disc ? {name:disc.name, pct:disc.pct} : null;
    const orders = sessionOrders(t).filter(o => o.status !== 'paid');
    const pays = collectPayments(fd, r2(sum(orders.map(o => r2(subtotal(o) * (1 - (dObj?.pct || 0) / 100)))))); if (!pays) return;
    settleOrders(orders, pays, dObj);
    Object.assign(t, {status:'cleaning', bill:null}); S.openTable = t.id; dlg.close(); toast(`${t.name} paid. Clean the table, then mark it clean.`);
  },
  pickup:(fd, f) => {
    const o = S.orders.find(x => x.id === f.dataset.id), disc = S.discounts.find(d => d.id === fd.get('disc')), dObj = disc ? {name:disc.name, pct:disc.pct} : null;
    const pays = collectPayments(fd, r2(subtotal(o) * (1 - (dObj?.pct || 0) / 100))); if (!pays) return;
    settleOrders([o], pays, dObj);
    dlg.close(); toast(`${o.pickup} paid and picked up`);
  },
  // Pays one served order from the Orders screen. The table is cleaned up once nothing on it is unpaid.
  orderPay:(fd, f) => {
    const o = S.orders.find(x => x.id === f.dataset.id), disc = S.discounts.find(d => d.id === fd.get('disc')), dObj = disc ? {name:disc.name, pct:disc.pct} : null;
    const pays = collectPayments(fd, r2(subtotal(o) * (1 - (dObj?.pct || 0) / 100))); if (!pays) return;
    settleOrders([o], pays, dObj);
    const t = tableOf(o.table);
    if (t && t.token && o.session === t.token && ['active', 'ordering', 'eating', 'billout'].includes(t.status)){
      if (sessionOrders(t).some(x => x.status !== 'paid')) syncTable(t); else Object.assign(t, {status:'cleaning', bill:null});
    }
    dlg.close(); toast(`${o.id} paid${o.payment === 'split' ? ' with a split bill' : ' with ' + payName(o.payment)}${t && t.status === 'cleaning' ? `. ${t.name} is ready to clean.` : ''}`);
  },
  handover:(fd, f) => {
    const o = S.orders.find(x => x.id === f.dataset.id);

    dlg.close(); toast(`${o.pickup} handed to the ${chanOf(o).l} rider`);

  toSend:fd => {

  bill:fd => { const t = tableOf(S.guestTable); t.status = 'billout'; t.bill = {method:fd.get('method'), at:Date.now()}; dlg.close(); toast('Your waiter has been called'); },
  variant:fd => { const f = food(S.pick); if (f) addToPlate(f, fd.get('variant')); S.pick = null; },
  food:(fd, f) => {
    const v = {name:fd.get('name').trim(), cat:fd.get('cat'), price:r2(+fd.get('price')), eta:Math.round(+fd.get('eta')), desc:fd.get('desc').trim(), status:fd.get('status'), tags:fd.getAll('tags'), photos:[...draftPhotos]};
    if (!v.name) return;
    const vn = fd.getAll('vname'), vp = fd.getAll('vprice'), vi = fd.getAll('vid');
    v.variants = vn.map((nm, i) => ({id:vi[i] || uid(), name:nm.trim(), price:r2(+vp[i])})).filter(x => x.name);
    if (new Set(v.variants.map(x => x.name.toLowerCase())).size !== v.variants.length) return toast('Each variant needs a different name');
    if (v.variants.length) v.price = Math.min(...v.variants.map(x => x.price));
    if (f.dataset.id) Object.assign(food(f.dataset.id), v); else S.foods.push({id:'f' + uid(), ...v});

    else if (S.setTab === 'tables') S.tables.push({id:'T' + uid(), ...v, x:50, y:50, status:'inactive', token:null, openedAt:null, bill:null});

    dlg.close(); toast(`${v.name} saved`);

Object.assign(FORMS, {

    const problem = resProblem(tableId, pax, at, id); if (problem) return toast(problem);
    let order = null;
    if (fd.has('adv')){ order = draftItems(S.roDraft); if (!order.length) return toast('Pick food for the advance order, or turn it off'); }
    const v = {name, phone:fd.get('phone').trim(), pax, at, tableId, note:fd.get('note').trim(), order};
    if (id){ const r = resOf(id); if (r.at !== at) r.dismissed = false; Object.assign(r, v); r.history.push({at:Date.now(), text:'Edited'}); toast(`${name} saved`); }
    else { S.reservations.push({id:uid(), status:'booked', history:[{at:Date.now(), text:'Booked'}], ...v}); toast(`${name} booked for ${whenText(at)}`); }

  },
  splitToggle:el => { S.split.on = el.checked; if (el.checked) S.split.rows = equalRows(S.split.n, S.payDue, S.split.rows); splitRender(); return true; },
  splitN:el => { S.split.n = Math.min(12, Math.max(2, Math.round(+el.value) || 2)); S.split.rows = equalRows(S.split.n, S.payDue, S.split.rows); splitRender(); return true; },
  splitRow:el => { const row = S.split.rows[+el.dataset.i]; if (row){ if (el.dataset.k === 'amt') row.amt = r2(+el.value || 0); else row.method = el.value; } splitStatus(); return true; },
  resAdv:el => { $('#res-adv').hidden = !el.checked; return true; },
});
// Drag a booked reservation onto another day to reschedule it. The Reschedule button does the same without a mouse.
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset?.change !== 'splitRow' || el.dataset.k !== 'amt') return;
  const row = S.split.rows[+el.dataset.i]; if (row){ row.amt = r2(+el.value || 0); splitStatus(); }
});
let dragOver = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-rdrag]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.rdrag); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => {
  const c = e.target.closest?.('[data-rdrop]'); if (!c) return;
  e.preventDefault();
  if (dragOver !== c){ dragOver?.classList.remove('over'); dragOver = c; c.classList.add('over'); }
});
document.addEventListener('dragend', () => { dragOver?.classList.remove('over'); dragOver = null; });
document.addEventListener('drop', e => {
  const c = e.target.closest?.('[data-rdrop]'); if (!c) return;
  e.preventDefault(); dragOver?.classList.remove('over'); dragOver = null;
  const r = resOf(e.dataTransfer.getData('text/plain')); if (r){ moveResToDay(r, +c.dataset.rdrop); render(); }
});
// Re-render when a reminder becomes due or ends, without waiting for the next 30 second refresh.
setInterval(() => { if (!dlg.open && document.activeElement?.tagName !== 'INPUT' && dueRes().map(r => r.id).join() !== lastDue) render(); }, 10000);

/* ---------- Theme ---------- */
// Saved per browser; with no choice saved the page follows the system setting.
let theme = null;
try { theme = localStorage.getItem('fbs-theme'); } catch {}
const isDark = () => theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
if (theme) document.documentElement.dataset.theme = theme;
ACT.theme = () => {
  theme = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('fbs-theme', theme); } catch {}
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!theme) render(); });

/* ---------- Render loop ---------- */
// The top bar shows the brand only on the guest preview; staff screens have it at the top of the sidebar.
const topBar = brand => `<header class="top"><div class="top-in">${brand ? `<span class="brand">${LOGO}FBS Serve <small>Restaurant manager</small></span>` : ''}<span class="spacer"></span>
    <button class="icon-btn" data-act="theme" aria-label="${isDark() ? 'Switch to light mode' : 'Switch to dark mode'}" title="${isDark() ? 'Light mode' : 'Dark mode'}">${icon(isDark() ? 'sun' : 'moon')}</button>
    <div class="seg" role="group" aria-label="View as"><button data-act="mode" data-v="staff" aria-pressed="${S.mode === 'staff'}">${icon('user', 20)}Staff</button><button data-act="mode" data-v="guest" aria-pressed="${S.mode === 'guest'}">${icon('phone', 20)}Guest phone</button></div></div></header>`;
function render(){
  const a = document.activeElement, id = a?.id, sel = a?.selectionStart;
  const keep = {}; document.querySelectorAll('[data-keep]').forEach(el => keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]);
  document.body.classList.toggle('solo', !!S.guestOnly);
  MENUS = [];
  lastDue = dueRes().map(r => r.id).join();
  if (S.mode !== 'guest') S.pick = null;
  const hadSheet = !!document.querySelector('.g-sheet');
  $('#app').innerHTML = S.mode === 'guest' ? `${S.guestOnly ? '' : topBar(true)}${guestShell()}` : staffShell();
  document.querySelectorAll('[data-keep]').forEach(el => { const k = keep[el.dataset.keep]; if (k) [el.scrollLeft, el.scrollTop] = k; });
  if (!hadSheet) document.querySelector('.g-sheet input:checked')?.focus({preventScroll:true});
  watchFoods();
  if (id && !dlg.contains(a)){ const n = document.getElementById(id); if (n){ n.focus(); if (sel != null) try { n.setSelectionRange(sel, sel); } catch {} } }
}
// The ⋯ row menu lives outside #app (position: fixed) so a table's scroll box cannot clip it.
const rowMenu = document.body.appendChild(Object.assign(document.createElement('div'), {id:'rowmenu', className:'rowmenu', hidden:true}));
rowMenu.setAttribute('role', 'menu');
const closeMenu = (refocus = false) => {
  if (rowMenu.hidden) return;
  const v = rowMenu.dataset.v; rowMenu.hidden = true; rowMenu.innerHTML = ''; delete rowMenu.dataset.v;
  if (refocus) $(`[data-act="row-menu"][data-v="${v}"]`)?.focus();
};
ACT['row-menu'] = (d, el) => {
  const list = MENUS[+d.v]; if (!list) return;
  rowMenu.innerHTML = list.map(a => `<button role="menuitem" class="${a.danger ? 'danger' : ''}" data-act="${a.act}" data-id="${a.id}" aria-label="${esc(a.aria || a.label)}">${icon(a.ic, 18)}${esc(a.label)}</button>`).join('');
  rowMenu.dataset.v = d.v; rowMenu.hidden = false;
  const r = el.getBoundingClientRect(), w = rowMenu.offsetWidth, h = rowMenu.offsetHeight;
  rowMenu.style.left = clamp(r.right - w, 8, innerWidth - w - 8) + 'px';
  rowMenu.style.top = (r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + 'px';
  rowMenu.querySelector('button')?.focus({preventScroll:true});
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'), inMenu = !!e.target.closest('#rowmenu');
  // A click on the same ⋯ button that opened the menu just closes it.
  const toggleOff = el?.dataset.act === 'row-menu' && rowMenu.dataset.v === el.dataset.v || el?.dataset.act === 'col-filter' && colPop.dataset.k === el.dataset.v;
  if (!inMenu) closeMenu();
  if (!e.target.closest('#colpop')) closeColPop();
  if (!el || el.disabled || toggleOff) return;
  e.stopPropagation();
  if (inMenu) closeMenu();
  ACT[el.dataset.act]?.(el.dataset, el);
  render();
});
rowMenu.addEventListener('keydown', e => {
  const items = [...rowMenu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'Escape'){ e.preventDefault(); closeMenu(true); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); }
  else if (e.key === 'Tab') closeMenu(true);
});
// Column filter panel: like the row menu it lives outside #app, so it stays open while the table re-renders behind it.
const colPop = document.body.appendChild(Object.assign(document.createElement('div'), {id:'colpop', className:'colpop', hidden:true}));
colPop.setAttribute('role', 'dialog');
const closeColPop = (refocus = false) => {
  if (colPop.hidden) return;
  const k = colPop.dataset.k; colPop.hidden = true; colPop.innerHTML = ''; delete colPop.dataset.k;
  if (refocus) $(`[data-act="col-filter"][data-v="${k}"]`)?.focus();
};
const fillColPop = k => { const c = OCOLS.find(x => x.k === k); colPop.innerHTML = colPopHtml(c); colPop.setAttribute('aria-label', 'Filter ' + c.l); };
// Keeps the panel under its header button; the table re-renders and the page can scroll while the panel is open.
const placeColPop = () => {
  if (colPop.hidden) return;
  const el = $(`[data-act="col-filter"][data-v="${colPop.dataset.k}"]`); if (!el) return closeColPop();
  const r = el.getBoundingClientRect(), w = colPop.offsetWidth, h = colPop.offsetHeight;
  if (r.bottom < 0 || r.top > innerHeight) return closeColPop();
  colPop.style.left = clamp(r.left, 8, innerWidth - w - 8) + 'px';
  colPop.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
};
ACT['col-filter'] = d => {
  fillColPop(d.v); colPop.dataset.k = d.v; colPop.hidden = false;
  requestAnimationFrame(placeColPop);
  colPop.querySelector('input')?.focus({preventScroll:true});
};
ACT['cf-clear'] = d => { S.colF[d.v] = cfBlank(OCOLS.find(c => c.k === d.v)); fillColPop(d.v); };
ACT['cf-done'] = () => closeColPop(true);
ACT['cf-reset'] = () => { OCOLS.forEach(c => S.colF[c.k] = cfBlank(c)); closeColPop(); };
colPop.addEventListener('input', e => {
  const t = e.target, k = t.dataset.cf; if (!k) return;
  if (t.type === 'checkbox'){ const set = new Set(S.colF[k]); t.checked ? set.add(t.value) : set.delete(t.value); S.colF[k] = [...set]; }
  else if (t.dataset.end) S.colF[k] = {...S.colF[k], [t.dataset.end]:t.value};
  else S.colF[k] = t.value;
  render(); placeColPop();
});
colPop.addEventListener('keydown', e => { if (e.key === 'Escape'){ e.preventDefault(); closeColPop(true); } });
addEventListener('scroll', e => { closeMenu(); if (!colPop.contains(e.target)) placeColPop(); }, true);
addEventListener('resize', () => { closeMenu(); placeColPop(); });
document.addEventListener('input', e => { const k = e.target.dataset.input; if (k){ S[k] = e.target.value; render(); } });
document.addEventListener('change', e => { const k = e.target.dataset.change; if (k && !CHANGE[k](e.target)) render(); });
document.addEventListener('submit', e => { const f = e.target; if (!f.dataset.form) return; e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f); render(); });
dlg.addEventListener('close', () => { dlg.innerHTML = ''; dlg.classList.remove('wide'); });
let drag = null;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]'); if (!el) return;
  const t = tableOf(el.dataset.drag), r = el.closest('.floor').getBoundingClientRect();
  drag = {t, r, tw:el.closest('.tw'), dx:(e.clientX - r.left) / r.width * 100 - t.x, dy:(e.clientY - r.top) / r.height * 100 - t.y};
  el.setPointerCapture(e.pointerId); el.focus(); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const {r, tw} = drag;
  drag.x = clamp((e.clientX - r.left) / r.width * 100 - drag.dx, 3, 97);
  drag.y = clamp((e.clientY - r.top) / r.height * 100 - drag.dy, 5, 95);
  tw.style.left = drag.x + '%'; tw.style.top = drag.y + '%'; tw.classList.add('dragging');
});
const endDrag = () => { if (!drag) return; if (drag.x != null){ drag.t.x = r2(drag.x); drag.t.y = r2(drag.y); } drag = null; render(); };
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.pick){ S.pick = null; render(); } });
document.addEventListener('keydown', e => {
  const el = e.target.closest?.('[data-drag]'), k = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key];
  if (!el || !k) return;
  const t = tableOf(el.dataset.drag), step = e.shiftKey ? 5 : 1;
  t.x = clamp(t.x + k[0] * step, 3, 97); t.y = clamp(t.y + k[1] * step, 5, 95); e.preventDefault(); render();
});
setInterval(() => { if (!dlg.open && document.activeElement?.tagName !== 'INPUT') render(); }, 30000);
// Opened from a table QR code: show only the guest phone screen for that table.
{
  const q = new URLSearchParams(location.hash.slice(1)), qt = q.get('t'), qk = q.get('k');
  if (qt && qk){
    Object.assign(S, {guestOnly:true, mode:'guest', guestTable:qt, guestName:'Guest ' + (10 + Math.floor(Math.random() * 90))});
    const t = tableOf(qt);
    if (t){ Object.assign(t, {status:'active', token:qk, openedAt:Date.now(), bill:null}); S.plates[t.id] = []; }
  } else if (q.has('takeout')){
    // Opened from the Takeout QR: no table, the phone only sees its own takeout orders.
    Object.assign(S, {guestOnly:true, mode:'guest', guestTable:TO, guestTab:'menu', toMine:[]});
  }
}
render();
</script>
