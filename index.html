<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>FBS Serve</title>
<link rel="icon" href="assets/fbs-serve-logo.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar, left module rail on desktop (scroll strip on phone), content column max 1200px. Colors from the FBS Serve color system v1.0; type is Instrument Sans; spacing and radius from the Savora design guide. */
:root{
  --surface-page:#F4F6F8;--surface-card:#FFFFFF;--surface-elevated:#FFFFFF;--surface-sunken:#EEF1F5;
  --ink:#16191F;--ink-muted:#525B69;--border-control:#6B7584;--hairline:#DCE1E7;
  --brand:#476818;--brand-hover:#385217;--brand-active:#233510;--on-brand:#FFFFFF;--brand-tint:#EAF6CC;
  --secondary:#107236;--secondary-hover:#0C5A2A;--secondary-active:#08431F;--on-secondary:#FFFFFF;
  --accent:#C42A93;--accent-ink:#A51E7A;--accent-tint:#FADCEF;--on-accent:#FFFFFF;
  --disabled-bg:#EBEEF2;--disabled-ink:#5E6876;--focus:#C42A93;
  --success:#107236;--success-tint:#DCF5E5;--warning:#A7530A;--warning-tint:#FEF0D7;--error:#C11E38;--error-tint:#FDE2E6;
  --info:#1D5BD8;--info-tint:#DBE8FF;--purple:#6D33D9;--purple-tint:#ECE4FF;
  --shadow-card:0 1px 2px rgba(22,25,31,.08),0 4px 12px rgba(22,25,31,.06);
  --shadow-lift:0 2px 4px rgba(22,25,31,.10),0 10px 24px rgba(22,25,31,.12);
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-pill:999px;--tap:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-page:#0F1115;--surface-card:#16191F;--surface-elevated:#1D2128;--surface-sunken:#22262E;
  --ink:#EDF0F4;--ink-muted:#A9B2BF;--border-control:#808A98;--hairline:#2A2F38;
  --brand:#B8DF63;--brand-hover:#D4EC9C;--brand-active:#EAF6CC;--on-brand:#16191F;--brand-tint:#24301A;
  --secondary:#5EE08F;--secondary-hover:#8BE9AE;--secondary-active:#B5F1CB;--on-secondary:#0F1115;
  --accent:#E35BBF;--accent-ink:#E35BBF;--accent-tint:#3A1530;--on-accent:#16191F;
  --disabled-bg:#272C35;--disabled-ink:#A9B2BF;--focus:#E35BBF;
  --success:#5EE08F;--success-tint:#12301F;--warning:#FDBA4D;--warning-tint:#3A2810;--error:#FF8F8F;--error-tint:#3D161D;
  --info:#7DB0FF;--info-tint:#172A4A;--purple:#BCA4FF;--purple-tint:#2A1F4A;
  --shadow-card:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.35);
  --shadow-lift:0 2px 4px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-page:#0F1115;--surface-card:#16191F;--surface-elevated:#1D2128;--surface-sunken:#22262E;
  --ink:#EDF0F4;--ink-muted:#A9B2BF;--border-control:#808A98;--hairline:#2A2F38;
  --brand:#B8DF63;--brand-hover:#D4EC9C;--brand-active:#EAF6CC;--on-brand:#16191F;--brand-tint:#24301A;
  --secondary:#5EE08F;--secondary-hover:#8BE9AE;--secondary-active:#B5F1CB;--on-secondary:#0F1115;
  --accent:#E35BBF;--accent-ink:#E35BBF;--accent-tint:#3A1530;--on-accent:#16191F;
  --disabled-bg:#272C35;--disabled-ink:#A9B2BF;--focus:#E35BBF;
  --success:#5EE08F;--success-tint:#12301F;--warning:#FDBA4D;--warning-tint:#3A2810;--error:#FF8F8F;--error-tint:#3D161D;
  --info:#7DB0FF;--info-tint:#172A4A;--purple:#BCA4FF;--purple-tint:#2A1F4A;
  --shadow-card:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.35);
  --shadow-lift:0 2px 4px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface-page);color:var(--ink);font:400 16px/26px var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface-card)}
h1,h2,h3,h4,p{margin:0}
h1{font-size:36px;line-height:44px;text-wrap:balance}
h2{font-size:28px;line-height:36px;text-wrap:balance}
h3{font-size:22px;line-height:30px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.caption{font-size:14px;line-height:20px}
.label{font-size:14px;line-height:20px;font-weight:700}
.ic{flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface-card);border-bottom:1px solid var(--hairline)}
.top-in{display:flex;align-items:center;gap:16px;min-height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--ink)}
.logo{width:36px;height:36px;border-radius:9px;display:block;flex:none}
.brand small{font-size:14px;color:var(--ink-muted);font-weight:400}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{min-height:40px;border:0;background:none;border-radius:var(--r-pill);padding:0 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink-muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-card);color:var(--ink);box-shadow:var(--shadow-card)}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 65px)}
.rail{border-right:1px solid var(--hairline);background:var(--surface-card);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:0 12px;border-radius:var(--r-md);border:0;background:none;cursor:pointer;font-weight:700;color:var(--ink-muted);text-align:left;width:100%;transition:background .15s}
.nav:hover{background:var(--brand-tint);color:var(--ink)}
.nav[aria-current="page"]{background:var(--brand-tint);color:var(--brand)}
.nav .badge{margin-left:auto}
.badge{min-width:24px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);font-size:14px;line-height:24px;font-weight:700;text-align:center}
.badge.soft{background:var(--surface-sunken);color:var(--ink)}
.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head > div{flex:1;min-width:240px}
.page-head p{margin-top:4px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hairline);padding:8px max(16px,env(safe-area-inset-left,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);z-index:15}
  .nav{width:auto;flex:none}
  h1{font-size:28px;line-height:36px}
}

/* Alert banner */
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);flex-wrap:wrap}
.alert p{flex:1;min-width:200px}
.alert.brand{background:var(--accent-tint);color:var(--ink)}
.alert.brand .ic{color:var(--accent)}
.alert.info{background:var(--info-tint)}
.alert.warn{background:var(--warning-tint)}
.alert.warn .ic{color:var(--warning)}
.alert.ok{background:var(--success-tint)}
.alert.ok .ic{color:var(--success)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 20px;border-radius:var(--r-md);border:1.5px solid transparent;font-weight:700;font-size:16px;line-height:24px;cursor:pointer;transition:background .15s,transform .08s;text-decoration:none;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{background:var(--brand-active)}
.btn-secondary{background:var(--secondary);color:var(--on-secondary)}
.btn-secondary:hover{background:var(--secondary-hover)}
.btn-secondary:active{background:var(--secondary-active)}
.btn-outline{background:var(--surface-card);border-color:var(--border-control);color:var(--ink)}
.btn-outline:hover{background:var(--brand-tint)}
.btn-ghost{background:none;color:var(--ink)}
.btn-ghost:hover{background:var(--brand-tint)}
.btn-danger{background:var(--error);color:var(--on-brand)}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-ink);border-color:transparent;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;border-radius:var(--r-md);border:0;background:none;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--brand-tint)}
.icon-btn.danger{color:var(--error)}
@media (prefers-reduced-motion:reduce){.btn:active:not(:disabled){transform:none}*{animation:none!important;transition:none!important}}

/* Cards, pills, chips */
.card{background:var(--surface-card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:24px;min-width:0}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head h3{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 8px;border-radius:var(--r-pill);font-size:14px;line-height:20px;font-weight:700;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.p-neutral{background:var(--disabled-bg);color:var(--disabled-ink)}
.p-info{background:var(--info-tint);color:var(--info)}
.p-warn{background:var(--warning-tint);color:var(--warning)}
.p-ok{background:var(--success-tint);color:var(--success)}
.p-brand{background:var(--brand-tint);color:var(--brand)}
.p-accent{background:var(--accent-tint);color:var(--accent-ink)}
.p-purple{background:var(--purple-tint);color:var(--purple)}
.p-error{background:var(--error-tint);color:var(--error)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--border-control);background:var(--surface-card);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--brand-tint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface-card)}
.tag{display:inline-block;padding:0 8px;border-radius:var(--r-sm);font-size:14px;line-height:22px;font-weight:700}
.tag-new{background:var(--info-tint);color:var(--info)}
.tag-must{background:var(--brand-tint);color:var(--brand)}
.tag-best{background:var(--accent-tint);color:var(--accent-ink)}

/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .val{font-size:32px;line-height:40px;font-weight:700}
.tile .ic{color:var(--brand)}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.bar-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar-row .rank{font-weight:700;color:var(--ink-muted)}
.bar-track{grid-column:2/4;height:10px;border-radius:var(--r-pill);background:var(--surface-sunken);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--brand)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hairline)}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-sunken);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:24px;line-height:30px}
@media (max-width:480px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Data table */
.tbl-scroll{overflow-x:auto;border-radius:var(--r-lg);background:var(--surface-card);box-shadow:var(--shadow-card)}
table.data{width:100%;border-collapse:collapse;min-width:720px}
.data th{text-align:left;font-size:14px;line-height:20px;font-weight:700;color:var(--ink-muted);padding:12px 16px;border-bottom:1px solid var(--hairline);background:var(--surface-card);white-space:nowrap}
.data td{padding:12px 16px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.data tr:last-child td{border-bottom:0}
.data tbody tr.click{cursor:pointer}
.data tbody tr.click:hover{background:var(--brand-tint)}
.data .r{text-align:right}
.link{background:none;border:0;padding:0;font-weight:700;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink-muted)}
.search input{padding-left:44px}
.empty{padding:48px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span:first-child{font-size:14px;line-height:20px;font-weight:700}
.input,select.input,textarea.input{min-height:var(--tap);padding:10px 12px;border:1.5px solid var(--border-control);border-radius:var(--r-sm);background:var(--surface-card);width:100%}
textarea.input{min-height:96px;resize:vertical}
.hint{font-size:14px;line-height:20px;color:var(--ink-muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;align-items:center;gap:12px;min-height:var(--tap);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.checks{display:flex;flex-wrap:wrap;gap:0 20px}
.radio-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--border-control);border-radius:var(--r-md);cursor:pointer;min-height:56px}
.radio-card:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
.radio-card input{width:20px;height:20px;accent-color:var(--brand)}
.radio-card .grow{flex:1}

/* Dialog */
dialog{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface-elevated);color:var(--ink);box-shadow:var(--shadow-lift);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(22,19,15,.55)}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 16px 0 24px}
.m-head h2{flex:1;font-size:22px;line-height:30px}
.m-body{padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 24px;flex-wrap:wrap}
.qr{width:220px;height:220px;display:block;margin:0 auto;border-radius:var(--r-md)}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px;background:var(--surface-sunken);border-radius:var(--r-lg)}
.sum{display:flex;flex-direction:column;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .total{border-top:1px solid var(--hairline);padding-top:8px;font-weight:700;font-size:20px;line-height:28px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface-card);padding:12px 20px;border-radius:var(--r-md);font-weight:700;box-shadow:var(--shadow-lift);z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}

/* Kitchen kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-sunken);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 0}
.col-head h3{font-size:18px;line-height:28px;flex:1}
.kcard{background:var(--surface-card);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.kcard-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.kcard li{display:flex;gap:8px}
.kcard li b{min-width:28px}
.late{color:var(--error)}
.kcard.overdue{box-shadow:0 0 0 2px var(--focus),var(--shadow-card)}
.col-empty{color:var(--ink-muted);text-align:center;padding:24px 8px;font-size:14px}

/* Foods */
.food-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1023px){.food-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:639px){.food-grid{grid-template-columns:minmax(0,1fr)}}
.fcard{background:var(--surface-card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}
.fcard:hover{box-shadow:var(--shadow-lift)}
.fimg{aspect-ratio:16/10;max-width:100%;position:relative}
.fimg img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center}
.cat-0{background:var(--brand-tint);color:var(--brand)}
.cat-1{background:var(--accent-tint);color:var(--accent-ink)}
.cat-2{background:var(--info-tint);color:var(--info)}
.cat-3{background:var(--warning-tint);color:var(--warning)}
.cat-4{background:var(--purple-tint);color:var(--purple)}
.fimg .pill{position:absolute;top:12px;left:12px}
.fbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.fbody .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font-size:20px;line-height:28px;font-weight:700}
.factions{display:flex;gap:8px;padding:0 16px 16px;margin-top:auto}
.factions .btn{flex:1}
.thumb{width:56px;height:40px;border-radius:var(--r-sm);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.unavail{opacity:.72}

/* Settings tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);overflow-x:auto}
.tab{min-height:var(--tap);padding:0 16px;border:0;background:none;font-weight:700;color:var(--ink-muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* Guide */
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1023px){.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:639px){.guide-grid{grid-template-columns:minmax(0,1fr)}}
.gcard{display:flex;flex-direction:column;gap:12px}
.gcard .gi{width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--brand-tint);color:var(--brand)}
.gcard ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.gcard .btn{margin-top:auto;align-self:flex-start}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
.flow li{background:var(--surface-sunken);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px}
.flow .n{width:28px;height:28px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:14px}

function seed(){
  const r = rng(11), pick = a => a[Math.floor(r() * a.length)];
  const mk = (when, status, table, extra = {}) => {
    const items = [], n = 1 + Math.floor(r() * 4);
    while (items.length < n){
      const f = pick(S.foods);
      if (!items.some(i => i.foodId === f.id)) items.push({foodId:f.id, name:f.name, price:f.price, qty:1 + Math.floor(r() * 2)});
    }
    S.orders.push({id:nextId(), table, session:'old', items, status, createdAt:+when, by:'Guest 1', ...extra});
  };
  for (let d = 34; d >= 1; d--){
    const n = 8 + Math.floor(r() * 9);
    for (let i = 0; i < n; i++){
      const w = new Date(); w.setDate(w.getDate() - d); w.setHours(11 + Math.floor(r() * 10), Math.floor(r() * 60), 0, 0);
      mk(w, 'paid', 'T' + (1 + Math.floor(r() * 12)), {payment:pick(['cash','gcash','card']), discount:r() < .12 ? {name:'Senior citizen', pct:20} : null, paidAt:+w + 3e6});
    }
  }
  for (let i = 9; i >= 1; i--){
    mk(Date.now() - (60 + i * 22) * 60000, 'paid', 'T' + (1 + Math.floor(r() * 12)), {payment:pick(['cash','gcash','card']), discount:null, paidAt:Date.now() - i * 20 * 60000});
  }
  // Live floor
  const open = (id, status, minsAgo, orders = [], bill = null) => {
    const t = tableOf(id); t.status = status; t.token = uid(); t.openedAt = Date.now() - minsAgo * 60000; t.bill = bill;
    orders.forEach(([st, ago, by]) => { mk(Date.now() - ago * 60000, st, id, {by}); const o = S.orders.at(-1); o.session = t.token; if (st === 'served') o.servedAt = Date.now() - (ago - 18) * 60000; });
  };
  open('T1', 'ordering', 30, [['completed', 22, 'Guest 1']]);
  open('T2', 'ordering', 24, [['plating', 16, 'Guest 2']]);
  open('T3', 'active', 4);
  open('T4', 'ordering', 9, [['queued', 2, 'Guest 1']]);
  open('T5', 'eating', 55, [['served', 41, 'Guest 1'], ['served', 20, 'Guest 3']]);
  open('T6', 'ordering', 14, [['preparation', 6, 'Guest 2']]);
  open('T7', 'billout', 75, [['served', 62, 'Guest 1']], {method:'gcash', at:Date.now() - 2 * 60000});
  open('T8', 'cleaning', 90, [['paid', 80, 'Guest 1']]);
  open('T9', 'ordering', 20, [['cooking', 11, 'Guest 4']]);
  S.orders.filter(o => o.table === 'T8' && o.status === 'paid' && o.session !== 'old').forEach(o => { o.payment = 'cash'; o.discount = null; o.paidAt = Date.now() - 6 * 60000; });
  S.plates.T3 = [
    {id:uid(), foodId:'f6', qty:2, by:'Guest 1'},
    {id:uid(), foodId:'f9', qty:2, by:'Guest 1'},
    {id:uid(), foodId:'f14', qty:1, by:'Guest 2'},
  ];
}

function syncTable(t){

const pill = (meta, withIcon = true) => `<span class="pill p-${meta.c}">${withIcon && meta.i ? icon(meta.i, 16) : ''}${esc(meta.l)}</span>`;

function aggregate(orders){
  const m = new Map();
  orders.forEach(o => o.items.forEach(i => { const e = m.get(i.name) || {name:i.name, qty:0, price:i.price}; e.qty += i.qty; m.set(i.name, e); }));
  return [...m.values()];
}

function qrSvg(seedStr){
  const N = 25, r = rng(hash(seedStr)); let cells = '';
  const inFinder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inFinder(x, y) && r() < .48) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
  return `<svg class="qr" viewBox="-2 -2 ${N + 4} ${N + 4}" role="img" aria-label="QR code"><rect x="-2" y="-2" width="${N + 4}" height="${N + 4}" fill="#fff"/><g fill="#1B1B18">${cells}${f(0, 0)}${f(N - 7, 0)}${f(0, N - 7)}</g></svg>`;
}

function inRange(d, r){
  const t = new Date(d), n = new Date();
  if (r === 'today') return sameDay(t, n);
  if (r === 'week'){ const s = new Date(n); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); return t >= s; }
  return t.getFullYear() === n.getFullYear() && t.getMonth() === n.getMonth();
}

  ready.forEach(o => a.push(`<button class="btn btn-secondary" data-act="serve" data-id="${o.id}">${icon('check', 20)}Serve ${o.id}</button>`));

function cell(f, v){
  if (f.t === 'check') return v ? '<span class="pill p-ok">Yes</span>' : '<span class="pill p-neutral">No</span>';
  if (f.t === 'select') return esc(f.opts().find(o => o[0] === v)?.[1] || '—');
  if (f.t === 'multi') return esc((v || []).map(id => f.opts().find(o => o[0] === id)?.[1]).filter(Boolean).join(', ')) || '<span class="muted">None</span>';
  if (f.k === 'pct') return `<span class="num">${v}%</span>`;
  return esc(v) || '<span class="muted">—</span>';
}

      ${!live ? `<div class="g-scroll">${gClosed(t)}</div>` : `<div class="g-scroll" data-keep="gscroll">${({menu:gMenu, plate:gPlate, orders:gOrders, bill:gBill})[S.guestTab](t)}</div>

      <nav class="g-tabs" aria-label="Guest menu">${[['menu','Menu','utensils'], ['plate','Plate','plate'], ['orders','Orders','clock'], ['bill','Bill','wallet']].map(([k, l, ic]) => `<button class="g-tab" data-act="g-tab" data-v="${k}" ${S.guestTab === k ? 'aria-current="page"' : ''}>${icon(ic)}${l}${k === 'plate' && n ? `<span class="badge num">${n}</span>` : ''}</button>`).join('')}</nav>`}

function gClosed(t){
  if (t.status === 'cleaning') return `<div class="center"><div class="big-ic">${icon('check', 32)}</div><h3>Payment received</h3><p class="muted">Thank you for dining at FBS Serve. This table QR is now closed.</p></div>`;
  return `<div class="center"><div class="big-ic">${icon('qr', 32)}</div><h3>This QR code has expired</h3><p class="muted">Ask your waiter for a new QR code for ${t.name}.</p></div>`;
}
function gMenu(){
  const cats = [['all','All']].concat(S.categories.map(c => [c.id, c.name]));
  const list = S.foods.filter(f => S.guestCat === 'all' || f.cat === S.guestCat);
  return `<div class="g-cats" data-keep="gcats">${cats.map(([k, l]) => `<button class="chip" data-act="g-cat" data-v="${k}" aria-pressed="${S.guestCat === k}">${esc(l)}</button>`).join('')}</div>
  ${list.map(f => { const ok = f.status === 'available'; return `<article class="gfood ${ok ? '' : 'unavail'}"><div class="gimg">${foodImg(f, 32)}</div><div class="info">

function gPlate(t){

  <div class="card" style="padding:4px 16px">${plate.map(l => { const f = food(l.foodId); return `<div class="pline"><div class="grow"><b>${esc(f.name)}</b><div class="caption muted">${esc(l.by)}${l.by === S.guestName ? ' (you)' : ''} · <span class="num">${peso(f.price * l.qty)}</span></div></div>
    <div class="stepper"><button data-act="g-qty" data-id="${l.id}" data-v="-1" aria-label="Remove one ${esc(f.name)}">${icon(l.qty > 1 ? 'minus' : 'trash', 20)}</button><span class="num">${l.qty}</span><button data-act="g-qty" data-id="${l.id}" data-v="1" aria-label="Add one ${esc(f.name)}">${icon('plus', 20)}</button></div></div>`; }).join('')}</div>`;

function gOrders(t){
  const os = sessionOrders(t).sort((a, b) => b.createdAt - a.createdAt);

  return os.map(o => { const k = GSTEPS.indexOf(o.status), m = OSTAT[o.status]; return `<section class="card track" style="padding:16px">
    <span class="caption muted num">${o.id} · ${tm(o.createdAt)} · sent by ${esc(o.by)}</span>
    <h3>${m.g}</h3><p class="caption muted">${m.d}</p>

    <ol class="steps">${GSTEP_L.map((l, i) => `<li class="${i < k || o.status === 'served' ? 'done' : i === k ? 'now' : ''}"><span class="dot">${i < k || o.status === 'served' ? icon('check') : ''}</span>${l}</li>`).join('')}</ol>

  </section>`; }).join('');
}
function gBill(t){
  const os = sessionOrders(t), tot = sum(os.map(total));
  if (t.status === 'billout') return `<div class="center"><div class="big-ic">${icon('bell', 32)}</div><h3>Your waiter is on the way</h3><p class="muted">You chose ${esc(payName(t.bill.method))}. Total <b class="num">${peso(tot)}</b>.</p><p class="caption muted">Discounts like senior citizen or PWD are applied by the waiter. Have your ID ready.</p></div>`;
  if (!os.length) return `<div class="center"><div class="big-ic">${icon('wallet', 32)}</div><h3>Nothing to pay yet</h3><p class="muted">Your bill appears here after you order.</p></div>`;

  return `<h3>Your bill</h3>
  <div class="card" style="padding:16px"><ul class="items">${aggregate(os).map(i => `<li><b class="num">${i.qty}×</b><span>${esc(i.name)}</span><span class="num">${peso(i.qty * i.price)}</span></li>`).join('')}</ul>

  ${waiting ? `<div class="alert warn">${icon('alert')}<p class="caption">You can ask for the bill once all your food is served.</p></div>` : ''}
  <button class="btn btn-primary block" data-act="g-billout" ${waiting ? 'disabled' : ''}>${icon('bell', 20)}Bill out</button>`;
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const el = $('#toast'); el.innerHTML = icon('check', 20) + esc(msg); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------- Actions ---------- */
const ACT = {
  close:() => dlg.close(),
  nav:d => { S.view = d.v; S.mode = 'staff'; S.openTable = null; dlg.close(); scrollTo(0, 0); },
  mode:d => { S.mode = d.v; dlg.close(); scrollTo(0, 0); },
  tbl:d => { S.openTable = S.openTable === d.id ? null : d.id; },
  'gen-qr':d => { const t = tableOf(d.id); Object.assign(t, {status:'active', token:uid(), openedAt:Date.now(), bill:null}); S.plates[t.id] = []; qrModal(t); toast(`${t.name} is now active`); },
  'show-qr':d => qrModal(tableOf(d.id)),
  'open-guest':d => { S.mode = 'guest'; S.guestTable = d.id; S.guestTab = 'menu'; dlg.close(); scrollTo(0, 0); },
  knext:d => { const o = S.orders.find(x => x.id === d.id); o.status = KITCHEN[KITCHEN.indexOf(o.status) + 1]; toast(`${o.id} moved to ${OSTAT[o.status].l}`); },
  serve:d => { const o = S.orders.find(x => x.id === d.id); o.status = 'served'; o.servedAt = Date.now(); syncTable(tableOf(o.table)); toast(`${o.id} served to ${tableOf(o.table).name}`); },
  receive:d => payModal(tableOf(d.id)),
  clean:d => { const t = tableOf(d.id); Object.assign(t, {status:'inactive', token:null, openedAt:null, bill:null}); S.plates[t.id] = []; toast(`${t.name} is ready for new guests. The old QR no longer works.`); },
  order:d => orderModal(S.orders.find(o => o.id === d.id)),
  range:d => { S.orderRange = d.v; S.orderQ = ''; },
  'food-view':d => { S.foodView = d.v; },
  'food-cat':d => { S.foodCat = d.v; },
  'food-add':() => foodModal(null),
  'food-edit':d => foodModal(food(d.id)),
  'food-del':d => confirmModal('Delete food?', `<b>${esc(food(d.id).name)}</b> will be removed from the menu. Past orders keep their record.`, 'food-del-ok', d.id, 'Delete food'),
  'food-del-ok':d => { const f = food(d.id); S.foods = S.foods.filter(x => x.id !== d.id); dlg.close(); toast(`${f.name} deleted`); },
  'set-tab':d => { S.setTab = d.v; },
  'set-add':() => setModal(null),
  'set-edit':d => setModal(S[S.setTab].find(r => r.id === d.id)),
  'set-del':d => {
    const row = S[S.setTab].find(r => r.id === d.id);
    const used = S.setTab === 'categories' ? S.foods.filter(f => f.cat === d.id).length : S.setTab === 'roles' ? S.users.filter(u => u.role === d.id).length : 0;
    if (used) return modal(`Can’t delete ${esc(row.name)}`, `<div class="m-body"><div class="alert warn">${icon('alert')}<p>${used} ${S.setTab === 'categories' ? 'foods use this category. Move them to another category first.' : 'users have this role. Give them another role first.'}</p></div></div>`, `<div class="m-foot"><button class="btn btn-outline" data-act="close">OK</button></div>`);
    confirmModal(`Delete ${SET[S.setTab].one}?`, `<b>${esc(row.name)}</b> will be deleted.`, 'set-del-ok', d.id, 'Delete');
  },
  'set-del-ok':d => { S[S.setTab] = S[S.setTab].filter(r => r.id !== d.id); dlg.close(); toast('Deleted'); },
  // guest
  'g-who':d => { S.guestName = d.v; },
  'g-tab':d => { S.guestTab = d.v; },
  'g-cat':d => { S.guestCat = d.v; },
  'g-add':d => {
    const p = S.plates[S.guestTable] = S.plates[S.guestTable] || [];
    const l = p.find(x => x.foodId === d.id && x.by === S.guestName);
    l ? l.qty++ : p.push({id:uid(), foodId:d.id, qty:1, by:S.guestName});
    toast(`${food(d.id).name} added to plate`);
  },
  'g-qty':d => { const p = S.plates[S.guestTable], l = p.find(x => x.id === d.id); l.qty += +d.v; if (l.qty < 1) S.plates[S.guestTable] = p.filter(x => x !== l); },
  'g-send':() => {
    const t = tableOf(S.guestTable), p = S.plates[t.id];
    modal('Send plate to kitchen?', `<div class="m-body"><p>You are sending the plate for everyone at ${t.name}. Only one guest sends it, so check with your table first.</p>
      <ul class="items">${p.map(l => `<li><b class="num">${l.qty}×</b><span>${esc(food(l.foodId).name)}</span><span class="caption muted">${esc(l.by)}</span></li>`).join('')}</ul></div>`,
      `<div class="m-foot"><button class="btn btn-outline" data-act="close">Not yet</button><button class="btn btn-primary" data-act="g-send-ok">Send to kitchen</button></div>`);
  },
  'g-send-ok':() => {
    const t = tableOf(S.guestTable), p = S.plates[t.id];
    const items = []; p.forEach(l => { const f = food(l.foodId), e = items.find(i => i.foodId === f.id); e ? e.qty += l.qty : items.push({foodId:f.id, name:f.name, price:f.price, qty:l.qty}); });
    const o = {id:nextId(), table:t.id, session:t.token, items, status:'queued', createdAt:Date.now(), by:S.guestName};
    S.orders.push(o); S.plates[t.id] = []; syncTable(t); S.guestTab = 'orders'; dlg.close(); toast(`${o.id} sent to the kitchen`);
  },
  'g-billout':() => {
    const t = tableOf(S.guestTable);
    modal('Bill out', `<form id="bill-form" data-form="bill"><div class="m-body"><p>How would you like to pay? Your waiter will come to your table.</p>
      ${S.payments.filter(p => p.active).map((p, i) => `<label class="radio-card"><input type="radio" name="method" value="${p.id}" ${i ? '' : 'checked'}><span class="grow"><b>${esc(p.name)}</b><br><span class="caption muted">${esc(p.details)}</span></span></label>`).join('')}
      <div class="sum"><div class="total"><span>Total</span><span class="num">${peso(sum(sessionOrders(t).map(total)))}</span></div></div></div>
      <div class="m-foot"><button type="button" class="btn btn-outline" data-act="close">Cancel</button><button class="btn btn-primary">${icon('bell', 20)}Call my waiter</button></div></form>`);
  },
};
const FORMS = {
  pay:(fd, f) => {
    const t = tableOf(f.dataset.id), disc = S.discounts.find(d => d.id === fd.get('disc'));
    sessionOrders(t).filter(o => o.status !== 'paid').forEach(o => Object.assign(o, {status:'paid', payment:fd.get('method'), discount:disc ? {name:disc.name, pct:disc.pct} : null, paidAt:Date.now()}));
    Object.assign(t, {status:'cleaning', bill:null}); S.openTable = t.id; dlg.close(); toast(`${t.name} paid. Clean the table, then mark it clean.`);
  },
  bill:fd => { const t = tableOf(S.guestTable); t.status = 'billout'; t.bill = {method:fd.get('method'), at:Date.now()}; dlg.close(); toast('Your waiter has been called'); },
  food:(fd, f) => {
    const v = {name:fd.get('name').trim(), cat:fd.get('cat'), price:r2(+fd.get('price')), desc:fd.get('desc').trim(), status:fd.get('status'), tags:fd.getAll('tags'), img:dlg.dataset.img || ''};
    if (!v.name) return;
    if (f.dataset.id) Object.assign(food(f.dataset.id), v); else S.foods.push({id:'f' + uid(), ...v});
    dlg.close(); toast(f.dataset.id ? `${v.name} saved` : `${v.name} added to the menu`);
  },
  set:(fd, f) => {
    const cfg = SET[S.setTab], v = {};
    cfg.fields.forEach(x => v[x.k] = x.t === 'check' ? fd.has(x.k) : x.t === 'multi' ? fd.getAll(x.k) : x.t === 'number' ? +fd.get(x.k) : String(fd.get(x.k)).trim());
    if (f.dataset.id) Object.assign(S[S.setTab].find(r => r.id === f.dataset.id), v); else S[S.setTab].push({id:uid(), ...v});
    dlg.close(); toast(`${v.name} saved`);
  },
};
const CHANGE = {
  gTable:el => { S.guestTable = el.value; S.guestTab = 'menu'; },
  payCalc:() => {
    const f = $('#pay-form'); if (!f) return;
    const t = tableOf(f.dataset.id), os = sessionOrders(t).filter(o => o.status !== 'paid');
    const sub = sum(os.map(subtotal)), d = S.discounts.find(x => x.id === $('#pay-disc').value);
    const off = d ? r2(sub * d.pct / 100) : 0;
    $('#pay-sum').innerHTML = `<div><span class="muted">Subtotal</span><span class="num">${peso(sub)}</span></div>${d ? `<div><span class="muted">${esc(d.name)} (${d.pct}%)</span><span class="num">−${peso(off)}</span></div>` : ''}<div class="total"><span>Amount to collect</span><span class="num">${peso(sub - off)}</span></div>`;
    $('#pay-note').textContent = d ? `Requirement: ${d.note || 'none'}.` : 'Check the guest’s ID before applying a discount.';
    return true;
  },
  foodImg:el => {
    const file = el.files[0]; if (!file) return true;
    const rd = new FileReader();
    rd.onload = () => { dlg.dataset.img = rd.result; $('#ff-prev').innerHTML = `<img src="${rd.result}" alt="">`; };
    rd.readAsDataURL(file); return true;
  },
};

/* ---------- Render loop ---------- */
function render(){
  const a = document.activeElement, id = a?.id, sel = a?.selectionStart;
  const keep = {}; document.querySelectorAll('[data-keep]').forEach(el => keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]);
  $('#app').innerHTML = `<header class="top"><div class="top-in"><span class="brand">${LOGO}FBS Serve <small>Restaurant manager</small></span><span class="spacer"></span>
    <div class="seg" role="group" aria-label="View as"><button data-act="mode" data-v="staff" aria-pressed="${S.mode === 'staff'}">${icon('user', 20)}Staff</button><button data-act="mode" data-v="guest" aria-pressed="${S.mode === 'guest'}">${icon('phone', 20)}Guest phone</button></div></div></header>
    ${S.mode === 'guest' ? guestShell() : staffShell()}`;
  document.querySelectorAll('[data-keep]').forEach(el => { const k = keep[el.dataset.keep]; if (k) [el.scrollLeft, el.scrollTop] = k; });
  if (id && !dlg.contains(a)){ const n = document.getElementById(id); if (n){ n.focus(); if (sel != null) try { n.setSelectionRange(sel, sel); } catch {} } }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  e.stopPropagation();
  ACT[el.dataset.act]?.(el.dataset, el);
  render();
});
document.addEventListener('input', e => { const k = e.target.dataset.input; if (k){ S[k] = e.target.value; render(); } });
document.addEventListener('change', e => { const k = e.target.dataset.change; if (k && !CHANGE[k](e.target)) render(); });
document.addEventListener('submit', e => { const f = e.target; if (!f.dataset.form) return; e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f); render(); });
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
setInterval(() => { if (!dlg.open && document.activeElement?.tagName !== 'INPUT') render(); }, 30000);
render();
</script>

</body>
